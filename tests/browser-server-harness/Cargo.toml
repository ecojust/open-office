[package]
name = "open-office-browser-server-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "office-browser-harness"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
tempfile = "3"
percent-encoding = "2"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
