name: Publish previously verified desktop installers

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed desktop build run whose latest platform verification jobs all passed
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: open-office-desktop-publish-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate exact source artifacts and publish installers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERIFIED_BUILD_RUN_ID: ${{ inputs.source_run_id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out publication workflow and artifact selector
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select exact artifacts from successful latest platform verification jobs
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.match(process.env.VERIFIED_BUILD_RUN_ID, /^[1-9][0-9]*$/);'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_BUILD_RUN_ID}" > source-run.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_BUILD_RUN_ID}/jobs?filter=latest&per_page=100" > source-job-pages.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_BUILD_RUN_ID}/artifacts?per_page=100" > source-artifact-pages.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const [input, output, key] of [['source-job-pages.json', 'source-jobs.json', 'jobs'], ['source-artifact-pages.json', 'source-artifacts.json', 'artifacts']]) {
            const pages = JSON.parse(readFileSync(input, 'utf8'));
            assert.ok(Array.isArray(pages) && pages.length > 0, `Missing ${key} response pages`);
            const total = pages[0].total_count;
            assert.ok(Number.isSafeInteger(total) && total >= 0, `Invalid ${key} total`);
            assert.ok(pages.every(page => page.total_count === total && Array.isArray(page[key])), `${key} changed during pagination`);
            const values = pages.flatMap(page => page[key]);
            assert.equal(values.length, total, `Incomplete ${key} response`);
            writeFileSync(output, JSON.stringify({ total_count: total, [key]: values }) + '\n');
          }
          NODE
          node scripts/select-desktop-release-artifacts.mjs --run source-run.json --jobs source-jobs.json --artifacts source-artifacts.json --run-id "$VERIFIED_BUILD_RUN_ID" --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > selected-artifacts.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const selection = JSON.parse(readFileSync('selected-artifacts.json', 'utf8'));
          assert.equal(String(selection.sourceRunId), process.env.VERIFIED_BUILD_RUN_ID);
          assert.match(selection.sourceCommit, /^[0-9a-f]{40}$/);
          assert.equal(selection.artifactIds.length, 3);
          assert.ok(selection.artifactIds.every(id => Number.isSafeInteger(id) && id > 0));
          appendFileSync(process.env.GITHUB_OUTPUT, `head_sha=${selection.sourceCommit}\nartifact_ids=${selection.artifactIds.join(',')}\n`);
          appendFileSync(process.env.GITHUB_ENV, `VERIFIED_SOURCE_SHA=${selection.sourceCommit}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Source run: ${selection.sourceRunId}\n\nSource commit: ${selection.sourceCommit}\n\nSelected artifact IDs: ${selection.artifactIds.join(', ')}\n\nAll prior artifacts remain available in the source run.\n`);
          NODE
      - name: Check out the exact installer source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.selection.outputs.head_sha }}
          path: verified-source
          persist-credentials: false
      - name: Download only the three selected immutable artifacts
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.selection.outputs.artifact_ids }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true
      - name: Validate all native reports and create exact source archive
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, statSync, writeFileSync } from 'node:fs';
          import { validateFrontendReport } from './verified-source/scripts/native-smoke.mjs';
          import { sha256File, verifyTransferProof } from './verified-source/scripts/macos-intel-transfer.mjs';
          assert.equal(execFileSync('git', ['-C', 'verified-source', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), process.env.VERIFIED_SOURCE_SHA);
          const version = JSON.parse(readFileSync('verified-source/package.json', 'utf8')).version;
          assert.match(version, /^\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?$/);
          const required = [];
          for (const [id, target] of [['windows-x64', 'x86_64-pc-windows-msvc'], ['macos-arm64', 'aarch64-apple-darwin'], ['macos-x64', 'x86_64-apple-darwin']]) {
            const report = JSON.parse(readFileSync(`artifacts/${id}-native-smoke.json`, 'utf8'));
            assert.equal(report.ok, true, `${id} did not pass native checks`);
            assert.equal(report.commit, process.env.VERIFIED_SOURCE_SHA);
            assert.equal(report.runId, process.env.VERIFIED_BUILD_RUN_ID);
            assert.equal(report.target, target);
            assert.equal(report.platformId, id);
            assert.equal(report.process.exitCode, 0);
            assert.equal(report.process.timedOut, false);
            assert.equal(report.frontend.ok, true);
            validateFrontendReport(report.frontend);
            assert.equal(report.targetArch, id === 'macos-arm64' ? 'arm64' : 'x64');
            assert.equal(report.hostArch, id === 'windows-x64' ? 'x64' : 'arm64');
            assert.equal(report.executionMode, id === 'macos-x64' ? 'rosetta2' : 'native');
            if (id === 'macos-x64') {
              const proof = JSON.parse(readFileSync('artifacts/macos-x64-build-proof.json', 'utf8'));
              const transfer = JSON.parse(readFileSync('artifacts/macos-x64-transfer-validation.json', 'utf8'));
              assert.equal(proof.dmg.name, `Open-Office-${version}-macos-x64.dmg`);
              verifyTransferProof(proof, { commit: process.env.VERIFIED_SOURCE_SHA, runId: process.env.VERIFIED_BUILD_RUN_ID, dmgPath: `artifacts/${proof.dmg.name}` });
              assert.equal(transfer.ok, true);
              assert.equal(transfer.commit, process.env.VERIFIED_SOURCE_SHA);
              assert.equal(transfer.runId, process.env.VERIFIED_BUILD_RUN_ID);
              assert.equal(transfer.target, target);
              assert.equal(transfer.executionMode, 'rosetta2');
              assert.equal(transfer.targetArch, 'x64');
              assert.equal(transfer.hostArch, 'arm64');
              assert.equal(transfer.unchangedAppBytesAndSymlinks, true);
              assert.equal(transfer.originalAppResigned, false);
              assert.equal(transfer.buildProofSha256, sha256File('artifacts/macos-x64-build-proof.json'));
              assert.equal(transfer.appInventorySha256, proof.app.sha256);
              assert.equal(transfer.dmg.sha256, proof.dmg.sha256);
              assert.deepEqual(transfer.signatures, proof.signatures);
              assert.deepEqual(report.preflight.macos.cdHashes, proof.signatures);
              assert.deepEqual(report.preflight.macos.mainArchitectures, ['x86_64']);
              assert.deepEqual(report.preflight.macos.pdfArchitectures, ['x86_64']);
              assert.equal(report.preflight.rosetta.hardwareArm64, 1);
              assert.equal(report.preflight.rosetta.nodeProcessTranslated, 0);
              assert.equal(report.preflight.rosetta.x86ProbeTranslated, 1);
            }
            const file = `Open-Office-${version}-${id}${id === 'windows-x64' ? '-setup.exe' : '.dmg'}`;
            assert.ok(statSync(`artifacts/${file}`).size > 0);
            required.push(file);
          }
          const source = `Open-Office-${version}-source.zip`;
          execFileSync('git', ['-C', 'verified-source', 'archive', '--format=zip', '--prefix=open-office/', `--output=../artifacts/${source}`, process.env.VERIFIED_SOURCE_SHA], { stdio: 'inherit' });
          required.push(source);
          const checksums = required.map(file => `${createHash('sha256').update(readFileSync(`artifacts/${file}`)).digest('hex')}  ${file}`).join('\n');
          writeFileSync('artifacts/SHA256SUMS', `${checksums}\n`);
          required.push('SHA256SUMS');
          writeFileSync('release-assets.json', `${JSON.stringify(required)}\n`);
          writeFileSync('release-version.txt', version);
          NODE
          (cd artifacts && sha256sum --check SHA256SUMS)
      - name: Publish installers, source, and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat release-version.txt)"
          tag="desktop-v${version}-${VERIFIED_BUILD_RUN_ID}"
          notes_file="verified-source/docs/releases/${version}.md"
          test -s "$notes_file"
          cp "$notes_file" release-notes.md
          cat >> release-notes.md <<EOF

          功能及验证记录：https://github.com/${GITHUB_REPOSITORY}/blob/${VERIFIED_SOURCE_SHA}/docs/rea-compatibility-progress.md
          窗口与已知输入异常：https://github.com/${GITHUB_REPOSITORY}/blob/${VERIFIED_SOURCE_SHA}/docs/office-viewport-validation.md
          第三方许可与源码：https://github.com/${GITHUB_REPOSITORY}/blob/${VERIFIED_SOURCE_SHA}/THIRD_PARTY_NOTICES.md
          源码提交：${VERIFIED_SOURCE_SHA}
          构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_BUILD_RUN_ID}
          发布校验记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const selection = JSON.parse(readFileSync('selected-artifacts.json', 'utf8'));
          const rows = [['Windows x64', selection.windowsArtifactId], ['macOS ARM64', selection.macosArmArtifactId], ['macOS Intel / Rosetta', selection.macosIntelArtifactId]];
          appendFileSync('release-notes.md', '\n| 验证平台 | Actions 产物 ID |\n| --- | --- |\n' + rows.map(([platform, id]) => `| ${platform} | ${id} |`).join('\n') + '\n');
          NODE
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > existing-tag.json 2> tag-error.txt; then
            test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)" = "$VERIFIED_SOURCE_SHA"
          elif ! grep -q 'HTTP 404' tag-error.txt; then
            cat tag-error.txt >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,tagName > existing-release.json; then
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('existing-release.json', 'utf8'));
          assert.equal(release.targetCommitish, process.env.VERIFIED_SOURCE_SHA, 'Refusing to reuse another source commit');
          assert.equal(release.isPrerelease, true, 'Refusing to alter a stable release');
          NODE
          else
            mapfile -t assets < <(node -e 'for (const file of require("./release-assets.json")) console.log(`artifacts/${file}`)')
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$VERIFIED_SOURCE_SHA" --draft --prerelease --title "Open Office ${version} · Windows / macOS" --notes-file release-notes.md "${assets[@]}"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,assets > release-ready.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('release-ready.json', 'utf8'));
          const required = JSON.parse(readFileSync('release-assets.json', 'utf8'));
          assert.equal(release.targetCommitish, process.env.VERIFIED_SOURCE_SHA);
          assert.equal(release.isPrerelease, true);
          assert.equal(release.assets.length, required.length, 'Public release must only contain installers, source and checksums');
          for (const file of required) {
            const matches = release.assets.filter(asset => asset.name === file);
            assert.equal(matches.length, 1, `Missing or duplicate release asset: ${file}`);
            assert.ok(matches[0].size > 0, `Empty release asset: ${file}`);
          }
          NODE
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)" = "$VERIFIED_SOURCE_SHA"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
