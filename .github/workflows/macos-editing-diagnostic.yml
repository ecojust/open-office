name: Diagnose full native macOS smoke and preserve crash evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-office-native-full-crash-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: macOS 15 ARM full smoke crash diagnostic (no release)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      OPEN_OFFICE_PLATFORM_ID: macos-arm64
      OPEN_OFFICE_TARGET: aarch64-apple-darwin
      EXPECTED_NODE_ARCH: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: arm64
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: tests/requirements-pdf-inspection.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            vendor/office-word -> target
            vendor/office-sheet -> target
            vendor/office-presentation -> target
            vendor/office-pdf -> target
          key: aarch64-apple-darwin
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Require native ARM interpreters and record Python
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$OPEN_OFFICE_TARGET"
          node -e 'if(process.platform!=="darwin"||process.arch!=="arm64")throw Error("Native Apple Silicon is required")'
          python - <<'PY'
          import os, platform, sys
          assert sys.platform == 'darwin' and platform.machine() == 'arm64'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'OPEN_OFFICE_PYTHON={sys.executable}\n')
          PY
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate native dependency lockfile
        run: cargo metadata --locked --format-version 1 --filter-platform aarch64-apple-darwin --manifest-path src-tauri/Cargo.toml > "$RUNNER_TEMP/open-office-native-metadata.json"
      - name: Install pinned editor WASM bridge
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - name: Install independent test-only PDF inspector
        run: python -m pip install -r tests/requirements-pdf-inspection.txt
      - name: Check frontend types and real editing round trips
        run: npm test
      - name: Build all editor resources
        run: npm run build
      - name: Verify all editor resources match source
        run: |
          npm run word:check
          npm run sheet:check
          npm run deck:check
          npm run pdf:check
          npm run engine:check:dist
      # Native engine regression suites remain required by desktop-release.yml.
      # This diagnostic skips those suites and cannot publish a release.
      - name: Build native diagnostic app
        id: package
        run: npm run desktop:build -- --bundles app
      - name: Retain exact App archive for subsequent diagnostics
        run: |
          mkdir -p artifacts/native-full-app
          tar -czf artifacts/native-full-app/Open-Office-diagnostic-macos-arm64.app.tar.gz -C src-tauri/target/release/bundle/macos 'Open Office.app'
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const hash = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const report = { schemaVersion: 1, diagnosticOnly: true, releaseAcceptance: false,
            commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            executableSha256: hash('src-tauri/target/release/bundle/macos/Open Office.app/Contents/MacOS/open-office'),
            archiveSha256: hash('artifacts/native-full-app/Open-Office-diagnostic-macos-arm64.app.tar.gz') };
          writeFileSync('artifacts/native-full-app/identity.json', JSON.stringify(report, null, 2) + '\n');
          NODE
      - name: Run one full native smoke with bounded OS crash capture
        timeout-minutes: 8
        run: node scripts/native-full-crash-diagnostics.mjs --app "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/macos/Open Office.app"
      - name: Summarize native stages using the strict fixed allowlist
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { nativeReportSummary } from './scripts/native-report-summary.mjs';
          const path = 'artifacts/macos-arm64-native-smoke.json';
          if (existsSync(path)) {
            const summary = nativeReportSummary(JSON.parse(readFileSync(path, 'utf8')));
            writeFileSync('artifacts/native-full-crash/native-summary.json', JSON.stringify(summary, null, 2) + '\n');
            const encoded = Buffer.from(JSON.stringify(summary)).toString('base64');
            const count = Math.ceil(encoded.length / 3800);
            if (count > 10) throw Error('Native summary exceeds the annotation count bound');
            for (let index = 0; index < count; index++) console.log(`::notice title=full-native-summary-${index+1}-of-${count}::${encoded.slice(index*3800,(index+1)*3800)}`);
          }
          NODE
      - name: Summarize bounded WebKit logs and process memory
        if: always()
        run: |
          if [ -d artifacts/native-full-crash ]; then
            python3 scripts/inspect-macos-diagnostic.py --directory artifacts/native-full-crash
          else
            echo 'Native crash collection was not reached; no native execution result is available.'
          fi
      - name: Summarize bounded IPS exception and WebKit stack evidence
        if: always()
        run: python3 scripts/inspect-native-full-crash.py artifacts/native-full-crash
      - name: Retain bounded native crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-office-native-full-crash-evidence
          path: |
            artifacts/native-full-crash/
            artifacts/macos-arm64-native-smoke.json
            artifacts/macos-arm64-native-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Retain built App even when native smoke fails
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: open-office-native-full-crash-app-macos-arm64
          path: artifacts/native-full-app/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
