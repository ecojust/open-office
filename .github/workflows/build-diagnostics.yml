name: Read bounded failed packaging diagnostics
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only the failed native package command tail
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          run=os.environ['SOURCE_RUN_ID'];repo=os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch(r'[0-9]+',run)
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/jobs?per_page=100']))['jobs']
          escape=lambda s:s.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          for job in jobs:
              if job['status']!='completed' or job['conclusion']!='failure':continue
              raw=subprocess.check_output(['gh','api',f"repos/{repo}/actions/jobs/{job['id']}/logs"],text=True)
              lines=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',raw).splitlines()
              starts=[i for i,l in enumerate(lines) if '##[group]Run npm run desktop:build' in l]
              assert starts,'Package command not found'
              start=starts[-1];ends=[i for i in range(start,len(lines)) if '##[error]' in lines[i]]
              end=ends[0]+1 if ends else len(lines)
              excerpt='\n'.join(l[:800] for l in lines[max(start,end-45):end])
              for i in range(0,len(excerpt),2800):
                  print(f"::notice title=Package command tail {i//2800:03d}::{escape(excerpt[i:i+2800])}")
          PY
