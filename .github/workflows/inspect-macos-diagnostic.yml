name: Inspect an existing macOS diagnostic

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed macos-editing-diagnostic.yml run ID in this repository
        required: true
        type: string
      expected_sha:
        description: Exact 40-character source commit expected on that run
        required: true
        type: string
      context_time:
        description: Optional UTC instant for raw PID messages within one second, for example 2026-10-15T17:16:18.24Z
        required: false
        default: ''
        type: string
      context_pids:
        description: Optional one or two observed process IDs, comma-separated; requires context_time
        required: false
        default: ''
        type: string
      rust_regression:
        description: Inspect the fixed Grid Rust regression Cargo log instead of native macOS evidence
        required: false
        default: false
        type: boolean
      crash_reporter_context:
        description: Inspect reporting-service logs from 2 seconds before to 10 seconds after the recorded WebContent SIGTRAP
        required: false
        default: false
        type: boolean
      all_editors:
        description: Inspect the fixed macOS ARM64 all-editor native smoke report
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Read bounded diagnostic evidence into check annotations
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the source run and summarize its diagnostic artifact
        env:
          GH_INSPECT_TOKEN: ${{ github.token }}
          INSPECT_RUN_ID: ${{ inputs.run_id }}
          INSPECT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          INSPECT_CONTEXT_TIME: ${{ inputs.context_time }}
          INSPECT_CONTEXT_PIDS: ${{ inputs.context_pids }}
          INSPECT_RUST_REGRESSION: ${{ inputs.rust_regression }}
          INSPECT_CRASH_REPORTER_CONTEXT: ${{ inputs.crash_reporter_context }}
          INSPECT_ALL_EDITORS: ${{ inputs.all_editors }}
        run: |
          args=()
          if [[ "$INSPECT_RUST_REGRESSION" == "true" ]]; then args+=(--rust-regression); fi
          if [[ "$INSPECT_CRASH_REPORTER_CONTEXT" == "true" ]]; then args+=(--crash-reporter-context); fi
          if [[ "$INSPECT_ALL_EDITORS" == "true" ]]; then args+=(--all-editors); fi
          python3 scripts/inspect-macos-diagnostic.py \
            --run-id "$INSPECT_RUN_ID" \
            --expected-sha "$INSPECT_EXPECTED_SHA" \
            --context-time "$INSPECT_CONTEXT_TIME" \
            --context-pids "$INSPECT_CONTEXT_PIDS" "${args[@]}"
