name: Read existing native verification diagnostics

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing desktop build run ID (diagnostics only, no rebuild or release)
        type: string
        required: true
      job_id:
        description: Optional failed job ID; expose only repository-known test names, compiler codes, and fixed failure categories
        type: string
        required: false
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate build identifier
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: node -e 'if(!/^[0-9]+$/.test(process.env.SOURCE_RUN_ID))throw Error("Invalid run ID")'
      - uses: actions/checkout@v4
      - name: Summarize only allowlisted failure identifiers without exposing logs
        if: inputs.job_id != ''
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          SOURCE_JOB_ID: ${{ inputs.job_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/read-failed-job-log.mjs
      - uses: actions/download-artifact@v4
        if: inputs.job_id == ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: open-office-native-*
          path: diagnostics
          merge-multiple: true
      - name: Expose existing bounded reports through readable check annotations
        if: inputs.job_id == ''
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, readdirSync, statSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { nativeReportSummary } from './scripts/native-report-summary.mjs';
          const files = readdirSync('diagnostics').filter(name => /^[a-z0-9-]+-native-smoke\.json$/.test(name));
          assert.ok(files.length > 0, 'No existing native verification reports were found');
          const escape = value => String(value).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          for (const file of files) {
            assert.ok(statSync(`diagnostics/${file}`).size <= 12 * 1024 * 1024, 'Diagnostic report exceeds 12 MiB');
            const report = JSON.parse(readFileSync(`diagnostics/${file}`, 'utf8'));
            // GitHub truncates each annotation message at 4096 bytes. Preserve
            // valid JSON through numbered ASCII chunks instead of cutting JSON
            // in the middle of an error or losing the final resource events.
            const excerpt = nativeReportSummary(report);
            const details = JSON.stringify(excerpt, null, 2);
            const encoded = Buffer.from(JSON.stringify(excerpt), 'utf8').toString('base64');
            const count = Math.ceil(encoded.length / 3000);
            for (let index = 0; index < count; index++) {
              const title = `${file}.base64-part-${String(index + 1).padStart(3, '0')}-of-${String(count).padStart(3, '0')}`;
              console.log(`::notice title=${escape(title)}::${encoded.slice(index * 3000, (index + 1) * 3000)}`);
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### ${file}\n\n<pre>${details.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')}</pre>\n`);
          }
          NODE
