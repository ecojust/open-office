name: Diagnose packaged MCP WebKit crash
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        required: true
      rewrite_i64:
        type: boolean
        default: false
      inspect_only:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    name: Diagnostic only / original Intel package / macOS 15
    runs-on: macos-15
    timeout-minutes: 15
    env:
      OPEN_OFFICE_PLATFORM_ID: macos-x64
      OPEN_OFFICE_TARGET: x86_64-apple-darwin
      OPEN_OFFICE_ALLOW_ROSETTA: '1'
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: arm64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tests/requirements-pdf-inspection.txt
      - name: Bind diagnostic to the existing source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > /tmp/source-run.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          const run=JSON.parse(readFileSync('/tmp/source-run.json'));
          assert.equal(run.head_sha,'2b26fab491a0c34bd2d4db61c66e07d0d9bbd907');
          assert.equal(run.path,'.github/workflows/desktop-release.yml');
          appendFileSync(process.env.GITHUB_ENV,`DIAGNOSTIC_SOURCE_SHA=${run.head_sha}\n`);
          JS
      - name: Require available Rosetta translation
        run: |
          if ! /usr/bin/arch -x86_64 /usr/sbin/sysctl -in sysctl.proc_translated; then
            /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: open-office-build-macos-x64
          path: artifacts
      - name: Verify and copy original package without modifying its resources
        run: GITHUB_SHA="$DIAGNOSTIC_SOURCE_SHA" GITHUB_RUN_ID="$SOURCE_RUN_ID" node scripts/macos-intel-transfer.mjs verify-and-copy
      - name: Apply explicitly diagnostic-only WASM overlay and re-sign the modified copy
        if: inputs.rewrite_i64 == true
        run: |
          cargo build --locked --release --manifest-path scripts/wasm-webkit-compat/Cargo.toml
          python - <<'PYTHON'
          import os,pathlib,subprocess,json,hashlib
          app=pathlib.Path(os.environ['OPEN_OFFICE_VERIFIED_APP'])
          files=list((app/'Contents/Resources').rglob('*.wasm'))
          assert len(files)>=4
          for p in files:
              subprocess.run(['scripts/wasm-webkit-compat/target/release/open-office-wasm-webkit-compat',str(p)],check=True)
              m=p.parent/'manifest.json';r=json.loads(m.read_text());r['files'][p.name]=hashlib.sha256(p.read_bytes()).hexdigest();r['sizeBytes']=p.stat().st_size;m.write_text(json.dumps(r,indent=2)+'\n')
          print('::notice title=Diagnostic overlay::Modified WASM and ad-hoc signature; not an unchanged installer or publication proof.')
          PYTHON
          codesign --force --deep --sign - "$OPEN_OFFICE_VERIFIED_APP"
      - name: Inspect actual packaged WASM constants without executing them
        run: |
          curl -fsSL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.262.0/wasm-tools-1.262.0-aarch64-macos.tar.gz -o /tmp/wasm-tools.tar.gz
          printf '801b237643cc0f4ab27ebd1745e7863e23bf194a038bc6ca8ce5618212e43669  /tmp/wasm-tools.tar.gz\n' | shasum -a 256 -c
          mkdir /tmp/wasm-tools
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp/wasm-tools
          python - <<'PYTHON'
          import os,pathlib,subprocess
          files=list(pathlib.Path(os.environ['OPEN_OFFICE_VERIFIED_APP'],'Contents/Resources').rglob('*.wasm'))
          assert len(files)>=4, 'Packaged editor WASM files are missing'
          subprocess.run(['python','scripts/diagnose-wasm-switches.py',*[str(p) for p in files]],check=True)
          PYTHON
      - name: Reproduce and retain bounded crash frames
        if: inputs.inspect_only != true
        run: |
          node --input-type=module <<'JS'
          import {spawn} from 'node:child_process';
          import {mkdirSync,readFileSync,writeFileSync} from 'node:fs';
          import {collectCrashReports} from './scripts/macos-editing-diagnostic.mjs';
          const started=Date.now(),directory='artifacts/crash-diagnostic';mkdirSync(directory,{recursive:true});
          const child=spawn(process.execPath,['scripts/native-smoke.mjs','--app',process.env.OPEN_OFFICE_VERIFIED_APP],{stdio:'inherit',env:{...process.env,GITHUB_SHA:process.env.DIAGNOSTIC_SOURCE_SHA,GITHUB_RUN_ID:process.env.SOURCE_RUN_ID}});
          const exitCode=await new Promise(resolve=>child.on('close',resolve));
          const crashes=await collectCrashReports(started,directory,{terminated:true});
          writeFileSync(`${directory}/collection.json`,JSON.stringify(crashes,null,2));
          console.log(`::notice title=Diagnostic reproduction::${JSON.stringify({diagnosticOnly:true,exitCode,crashes})}`);
          const escape=s=>s.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A');
          for(const file of crashes.files){
            const name=typeof file==='string'?file:file.file||file.path||file.destination||file.name;
            if(!name)continue;
            let text=readFileSync(`${directory}/${name}`,'utf8'),r;
            try{r=JSON.parse(text);}catch{r=JSON.parse(text.slice(text.indexOf('\n')+1));}
            const threads=r.threads||[],thread=threads[r.faultingThread]||threads.find(t=>t.triggered)||{};
            const frames=(thread.frames||[]).slice(0,64).map(f=>({symbol:String(f.symbol||'').slice(0,250),imageIndex:f.imageIndex}));
            for(let i=0;i<frames.length;i+=8)console.log(`::notice title=Crash stack ${i/8}::${escape(JSON.stringify({exception:r.exception,termination:r.termination,frames:frames.slice(i,i+8)}))}`);
          }
          if(exitCode)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-webkit-crash-diagnostic
          path: artifacts/crash-diagnostic
