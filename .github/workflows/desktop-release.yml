name: Inspect saved 0.6.0 native failure (diagnostics only)
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all]
        default: all
      publish:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ecojust/open-office
          run-id: '38656850060'
          name: open-office-native-macos-arm64
          path: evidence
      - name: Expose saved synthetic smoke evidence to the checks API
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync} from 'node:fs';
          const file='evidence/macos-arm64-native-smoke.json';
          const report=JSON.parse(readFileSync(file,'utf8'));
          if(report.commit!=='073675e7003ec9b41fa598300932a92cc680f63e'||report.runId!=='38656850060') throw Error('Wrong diagnostic evidence');
          const text=JSON.stringify(report);
          if(text.length>200000) throw Error('Unexpected diagnostic report size');
          const escape=s=>s.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A');
          for(let i=0;i<text.length;i+=5000) console.log(`::notice title=native-evidence-${String(i/5000).padStart(3,'0')}::${escape(text.slice(i,i+5000))}`);
          console.log('Saved artifact files:',readdirSync('evidence',{recursive:true}));
          NODE
