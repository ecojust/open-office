name: Build and verify offline desktop apps

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified installers as a prerelease after all platforms pass
        type: boolean
        required: false
        default: false
      platform:
        description: Native platform to verify (publishing requires all)
        type: choice
        required: true
        default: all
        options:
          - all
          - macos-arm64
          - windows-x64
          - macos-x64

permissions:
  contents: read

concurrency:
  group: open-office-desktop-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate requested platforms
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Require all native platforms before any public release
        id: platforms
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          const platforms = [
            { id: 'windows-x64', runner: 'windows-2022', target: 'x86_64-pc-windows-msvc', python: 'x64', nodeArch: 'x64', bundles: 'nsis' },
            { id: 'macos-arm64', runner: 'macos-15', target: 'aarch64-apple-darwin', python: 'arm64', nodeArch: 'arm64', bundles: 'app,dmg' },
            { id: 'macos-x64', runner: 'macos-15-intel', target: 'x86_64-apple-darwin', python: 'x64', nodeArch: 'x64', bundles: 'app,dmg' },
          ];
          const selected = process.env.SELECTED_PLATFORM;
          assert.ok(selected === 'all' || platforms.some(platform => platform.id === selected), 'Unknown native platform');
          if (process.env.PUBLISH === 'true') assert.equal(selected, 'all', 'Publishing requires successful verification on every supported native platform');
          const matrix = { include: selected === 'all' ? platforms : platforms.filter(platform => platform.id === selected) };
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE
  native:
    name: ${{ matrix.id }} native build and verification
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      OPEN_OFFICE_PLATFORM_ID: ${{ matrix.id }}
      OPEN_OFFICE_TARGET: ${{ matrix.target }}
      EXPECTED_NODE_ARCH: ${{ matrix.nodeArch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements-pdf-inspection.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            vendor/office-word -> target
            vendor/office-sheet -> target
            vendor/office-presentation -> target
            vendor/office-pdf -> target
          key: ${{ matrix.target }}
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Require native architecture and record build interpreter
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$OPEN_OFFICE_TARGET"
          node -e 'if(process.arch!==process.env.EXPECTED_NODE_ARCH)throw Error("Wrong native Node architecture");console.log(process.platform,process.arch)'
          python - <<'PY'
          import os, platform, sys
          architecture = {'AMD64':'x86_64','amd64':'x86_64','x86_64':'x86_64','arm64':'aarch64','aarch64':'aarch64'}[platform.machine()]
          system = {'win32':'pc-windows-msvc','darwin':'apple-darwin'}[sys.platform]
          assert f'{architecture}-{system}' == os.environ['OPEN_OFFICE_TARGET']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'OPEN_OFFICE_PYTHON={sys.executable}\n')
          print(sys.version, platform.platform())
          PY
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify native dependency lockfile before editor compilation
        run: cargo metadata --locked --format-version 1 --filter-platform "${{ matrix.target }}" --manifest-path src-tauri/Cargo.toml > "$RUNNER_TEMP/open-office-native-metadata.json"
      - name: Install pinned editor WASM bridge
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - name: Install independent test-only PDF inspector
        run: python -m pip install -r tests/requirements-pdf-inspection.txt
      - name: Check frontend types and real PDF editing round trips
        run: npm test
      - name: Build complete frontend resources before native resource validation
        run: npm run build
      - name: Verify bundled OfficeWord resources match the frozen source
        run: npm run word:check
      - name: Verify bundled spreadsheet resources match the frozen source
        run: npm run sheet:check
      - name: Verify bundled presentation resources match the frozen source
        run: npm run deck:check
      - name: Verify bundled PDF resources match the frozen source
        run: npm run pdf:check
      - name: Run Rust file bridge and lifecycle tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --include-ignored
      - name: Verify OfficeWord input, clipboard and saved-state regressions
        if: matrix.id == 'macos-arm64'
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          regression_status=0
          cargo test --locked --manifest-path vendor/office-word/Cargo.toml -p office-word-engine --lib delete_surrounding_ -- --test-threads=1 || regression_status=1
          cargo test --locked --manifest-path vendor/office-word/Cargo.toml -p office-word-ui-egui --lib browser_clipboard_ -- --test-threads=1 || regression_status=1
          cargo test --locked --manifest-path vendor/office-word/Cargo.toml -p office-word-ui-egui --lib input_method_ -- --test-threads=1 || regression_status=1
          cargo test --locked --manifest-path vendor/office-word/Cargo.toml -p office-word-ui-egui --lib host_saved_copy_ -- --test-threads=1 || regression_status=1
          cargo test --locked --manifest-path vendor/office-word/Cargo.toml -p office-word-ui-egui --lib embedded_ -- --test-threads=1 || regression_status=1
          cargo test --locked --manifest-path vendor/office-word/Cargo.toml -p office-word-ui-egui --lib command_search_ -- --test-threads=1 || regression_status=1
          cargo test --locked --manifest-path vendor/office-word/Cargo.toml -p office-word-ui-egui --lib office_svg:: -- --test-threads=1 || regression_status=1
          exit "$regression_status"
      - name: Verify embedded spreadsheet and Unicode PDF regressions
        if: matrix.id == 'macos-arm64'
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          cargo test --locked --manifest-path vendor/office-sheet/Cargo.toml -p open-office-sheet-host --lib
          cargo test --locked --manifest-path vendor/office-sheet/Cargo.toml -p office-sheet-ui-egui --lib embedding:: -- --test-threads=1
          cargo test --locked --manifest-path vendor/office-sheet/Cargo.toml -p office-sheet-ui-egui --lib office_svg:: -- --test-threads=1
          cargo test --locked --manifest-path vendor/office-sheet/Cargo.toml -p office-sheet-pdf --lib
      - name: Verify embedded presentation and PPTX/PDF regressions
        if: matrix.id == 'macos-arm64'
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          OPEN_OFFICE_FONTS_DIR: ${{ github.workspace }}/assets/fonts/open-office
          OPEN_OFFICE_DECK_FONTS_DIR: ${{ github.workspace }}/assets/fonts/deck
        run: |
          cargo test --locked --manifest-path vendor/office-presentation/Cargo.toml -p open-office-presentation-host --lib
          cargo test --locked --manifest-path vendor/office-presentation/Cargo.toml -p office-presentation-ui-egui --lib embedding:: -- --test-threads=1
          cargo test --locked --manifest-path vendor/office-presentation/Cargo.toml -p office-presentation-ui-egui --lib office_svg:: -- --test-threads=1
          cargo test --locked --manifest-path vendor/office-presentation/Cargo.toml -p office-presentation-pptx --lib
          cargo test --locked --manifest-path vendor/office-presentation/Cargo.toml -p office-presentation-pdf --lib
      - name: Verify PDF save receipts, editing round trips and isolated sessions
        if: matrix.id == 'macos-arm64'
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          OPEN_OFFICE_FONTS_DIR: ${{ github.workspace }}/assets/fonts/open-office
          OPEN_OFFICE_DECK_FONTS_DIR: ${{ github.workspace }}/assets/fonts/deck
        run: |
          cargo test --locked --manifest-path vendor/office-pdf/Cargo.toml -p office-pdf-fonts --lib shaping::cjk_tests::cjk_clusters_use_the_bundled_face_and_preserve_unicode -- --exact
          cargo test --locked --manifest-path vendor/office-pdf/Cargo.toml -p office-pdf-edit --lib tests::added_cjk_text_embeds_searchable_glyphs_wraps_and_survives_reopen -- --exact
          cargo test --locked --manifest-path vendor/office-pdf/Cargo.toml -p open-office-pdf-host --lib
          cargo test --locked --manifest-path vendor/office-pdf/Cargo.toml -p office-pdf-ui-egui --lib embedding:: -- --test-threads=1
          cargo test --locked --manifest-path vendor/office-pdf/Cargo.toml -p office-pdf-ui-egui --lib embedded_toolbar:: -- --test-threads=1
          cargo test --locked --manifest-path vendor/office-pdf/Cargo.toml -p office-pdf-ui-egui --lib delete_confirmation:: -- --test-threads=1
          cargo test --locked --manifest-path vendor/office-pdf/Cargo.toml -p office-pdf-ui-egui --lib fill_sign::tests::a_typed_signature_never_silently_omits_unsupported_name_characters -- --exact
      - name: Build native installation package
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Install Windows package to verify the delivered resource layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'open-office-native-install'
          if (Test-Path $installDirectory) { throw 'Refusing to reuse a previous installation directory' }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installDirectory") -PassThru
          if (-not $process.WaitForExit(180000)) {
            & "$env:SystemRoot/System32/taskkill.exe" /PID $process.Id /T /F
            throw 'NSIS installation timed out'
          }
          if ($process.ExitCode -notin @(0, 3010)) { throw "NSIS installation failed: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDirectory 'open-office.exe'))) { throw 'Installed desktop executable is missing' }
          "OPEN_OFFICE_INSTALLED_APP=$installDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify final desktop GUI, editors, notebook, and local autosave
        if: matrix.id != 'macos-x64'
        timeout-minutes: 8
        run: node scripts/native-smoke.mjs
      - name: Collect verified installer and internal build evidence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { copyFileSync, mkdirSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { validateFrontendReport } from './scripts/native-smoke.mjs';
          import { validateNativeOfficeWordEvidence } from './scripts/office-word-native-smoke.mjs';
          import { validateNativeOfficeSheetEvidence } from './scripts/office-sheet-native-smoke.mjs';
          import { validateNativeOfficePresentationEvidence } from './scripts/office-presentation-native-smoke.mjs';
          import { validateNativePdfEvidence } from './scripts/office-pdf-native-smoke.mjs';
          const id = process.env.OPEN_OFFICE_PLATFORM_ID;
          const target = process.env.OPEN_OFFICE_TARGET;
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          assert.match(version, /^\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?$/);
          if (id !== 'macos-x64') {
            const smoke = JSON.parse(readFileSync(`artifacts/${id}-native-smoke.json`, 'utf8'));
            assert.equal(smoke.ok, true);
            assert.equal(smoke.commit, process.env.GITHUB_SHA);
            assert.equal(smoke.runId, process.env.GITHUB_RUN_ID);
            assert.equal(smoke.target, target);
            assert.equal(smoke.platformId, id);
            assert.equal(smoke.executionMode, 'native');
            assert.equal(smoke.hostArch, process.arch);
            assert.equal(smoke.targetArch, process.arch);
            assert.equal(smoke.frontend.ok, true);
            validateFrontendReport(smoke.frontend);
            validateNativeOfficeWordEvidence(smoke);
            validateNativeOfficeSheetEvidence(smoke);
            validateNativeOfficePresentationEvidence(smoke);
            validateNativePdfEvidence(smoke);
            assert.equal(smoke.process.exitCode, 0);
            assert.equal(smoke.process.timedOut, false);
          }
          const windows = id === 'windows-x64';
          const folder = windows ? 'nsis' : 'dmg';
          const extension = windows ? '.exe' : '.dmg';
          const bundle = `src-tauri/target/release/bundle/${folder}`;
          const files = readdirSync(bundle).filter(file => file.endsWith(extension));
          assert.equal(files.length, 1);
          mkdirSync('artifacts', { recursive: true });
          const installer = `Open-Office-${version}-${id}${windows ? '-setup.exe' : '.dmg'}`;
          copyFileSync(join(bundle, files[0]), join('artifacts', installer));
          const manifest = JSON.parse(readFileSync('public/office-pdf/manifest.json', 'utf8'));
          assert.equal(manifest.engine, 'Open Office PDF');
          assert.equal(manifest.target, 'wasm32-unknown-unknown');
          assert.match(manifest.sourceHash, /^[0-9a-f]{64}$/);
          assert.match(manifest.files['office_pdf_bg.wasm'], /^[0-9a-f]{64}$/);
          writeFileSync(`artifacts/${id}-pdf-editor-manifest.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`Collected native installer: ${installer}`);
          NODE
      - name: Record Intel package signatures, complete App inventory, and actual Metal availability
        if: matrix.id == 'macos-x64'
        run: node scripts/macos-intel-transfer.mjs record
      - name: Retain diagnostic evidence in Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id == 'macos-x64' && 'open-office-build-macos-x64' || format('open-office-native-{0}', matrix.id) }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Explain unsuccessful native verification
        if: failure()
        run: |
          printf '### %s build or verification failed\n\nNo release will be published. Review the failed step above and the `open-office-native-%s` artifact when present. Native smoke checks have a 300-second deadline and retain structured errors.\n' "$OPEN_OFFICE_PLATFORM_ID" "$OPEN_OFFICE_PLATFORM_ID" >> "$GITHUB_STEP_SUMMARY"

  intel_rosetta:
    name: Unchanged Intel DMG / Rosetta real GUI round trip
    needs: [plan, native]
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos-x64' }}
    runs-on: macos-15
    timeout-minutes: 18
    env:
      OPEN_OFFICE_PLATFORM_ID: macos-x64
      OPEN_OFFICE_TARGET: x86_64-apple-darwin
      OPEN_OFFICE_ALLOW_ROSETTA: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent presentation PDF inspector
        run: python -m pip install -r tests/requirements-pdf-inspection.txt
      - name: Require an ARM verification host and available Rosetta translation
        run: |
          test "$(uname -m)" = arm64
          node -e 'if(process.platform!=="darwin"||process.arch!=="arm64")throw Error("Rosetta verifier must be native ARM Node")'
          test "$(/usr/sbin/sysctl -in hw.optional.arm64)" = 1
          if ! /usr/bin/arch -x86_64 /usr/sbin/sysctl -in sysctl.proc_translated > "$RUNNER_TEMP/rosetta-status.txt"; then
            /usr/sbin/softwareupdate --install-rosetta --agree-to-license
            /usr/bin/arch -x86_64 /usr/sbin/sysctl -in sysctl.proc_translated > "$RUNNER_TEMP/rosetta-status.txt"
          fi
          test "$(cat "$RUNNER_TEMP/rosetta-status.txt")" = 1
      - uses: actions/download-artifact@v4
        with:
          name: open-office-build-macos-x64
          path: artifacts
      - name: Verify original Intel DMG and copy its unchanged App with signatures intact
        run: node scripts/macos-intel-transfer.mjs verify-and-copy
      - name: Run the actual Intel App under Rosetta for four editors and autosave
        timeout-minutes: 8
        run: node scripts/native-smoke.mjs --app "$OPEN_OFFICE_VERIFIED_APP"
      - name: Check matching package, signatures, architecture, and successful real edits
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { validateFrontendReport } from './scripts/native-smoke.mjs';
          import { validateNativeOfficeWordEvidence } from './scripts/office-word-native-smoke.mjs';
          import { validateNativeOfficeSheetEvidence } from './scripts/office-sheet-native-smoke.mjs';
          import { validateNativeOfficePresentationEvidence } from './scripts/office-presentation-native-smoke.mjs';
          import { validateNativePdfEvidence } from './scripts/office-pdf-native-smoke.mjs';
          import { sha256File, verifyTransferProof } from './scripts/macos-intel-transfer.mjs';
          const report = JSON.parse(readFileSync('artifacts/macos-x64-native-smoke.json', 'utf8'));
          const proof = JSON.parse(readFileSync('artifacts/macos-x64-build-proof.json', 'utf8'));
          const transfer = JSON.parse(readFileSync('artifacts/macos-x64-transfer-validation.json', 'utf8'));
          verifyTransferProof(proof, { commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, dmgPath: `artifacts/${proof.dmg.name}` });
          assert.equal(report.ok, true);
          assert.equal(report.commit, process.env.GITHUB_SHA);
          assert.equal(report.runId, process.env.GITHUB_RUN_ID);
          assert.equal(report.platformId, 'macos-x64');
          assert.equal(report.target, 'x86_64-apple-darwin');
          assert.equal(report.targetArch, 'x64');
          assert.equal(report.hostArch, 'arm64');
          assert.equal(report.executionMode, 'rosetta2');
          assert.deepEqual(report.preflight.macos.mainArchitectures, ['x86_64']);
          assert.deepEqual(report.preflight.macos.cdHashes, proof.signatures);
          assert.equal(report.process.exitCode, 0);
          assert.equal(report.process.timedOut, false);
          assert.equal(transfer.ok, true);
          assert.equal(transfer.buildProofSha256, sha256File('artifacts/macos-x64-build-proof.json'));
          assert.equal(transfer.appInventorySha256, proof.app.sha256);
          assert.equal(transfer.dmg.sha256, proof.dmg.sha256);
          validateFrontendReport(report.frontend);
          validateNativeOfficeWordEvidence(report);
          validateNativeOfficeSheetEvidence(report);
          validateNativeOfficePresentationEvidence(report);
          validateNativePdfEvidence(report);
          NODE
      - name: Retain Intel package and Rosetta validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-office-native-macos-x64
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Explain unsuccessful Intel application validation
        if: failure()
        run: |
          printf '### Intel application verification failed\n\nThe unchanged x86_64 package did not pass the required Rosetta GUI checks on the ARM macOS runner. No release is permitted. Check the native report, transfer proof, and structured diagnostics in the artifact. This check is not a physical Intel GPU test.\n' >> "$GITHUB_STEP_SUMMARY"

  macos26_editing:
    name: Unchanged ARM DMG / macOS 26 real input editing
    needs: [plan, native]
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos-arm64' }}
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install independent document inspectors on native ARM Python
        run: |
          python - <<'PY'
          import os, platform, sys
          assert platform.machine() == 'arm64', 'Document inspectors require native ARM Python'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'OPEN_OFFICE_PYTHON={sys.executable}\n')
          PY
          python -m pip install -r tests/requirements-pdf-inspection.txt
      - name: Require native macOS 26 input permissions before testing the delivered package
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          node -e 'if(process.platform!=="darwin"||process.arch!=="arm64")throw Error("Editing verifier must be native ARM Node")'
          xcrun swiftc scripts/macos-os-input.swift -o "$RUNNER_TEMP/open-office-os-input"
          node scripts/macos-editing-diagnostic.mjs --helper "$RUNNER_TEMP/open-office-os-input" --preflight
      - name: Download the unchanged ARM installer from this build run
        uses: actions/download-artifact@v4
        with:
          name: open-office-native-macos-arm64
          path: native-package
      - name: Verify OS input, editors, notebook, and autosave against the installed ARM DMG
        timeout-minutes: 10
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, readdirSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const name = `Open-Office-${version}-macos-arm64.dmg`;
          assert.deepEqual(readdirSync('native-package').filter(file => file.endsWith('.dmg')), [name]);
          execFileSync(process.execPath, ['scripts/macos-arm-editing-gate.mjs', '--dmg', resolve('native-package', name), '--helper', join(process.env.RUNNER_TEMP, 'open-office-os-input')], { stdio: 'inherit' });
          NODE
      - name: Summarize editing evidence
        if: always()
        run: python3 scripts/inspect-macos-diagnostic.py --directory artifacts/macos-editing
      - name: Retain independent macOS 26 editing proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-office-macos26-editing-proof
          path: |
            artifacts/macos26-editing-proof.json
            artifacts/macos-editing/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Retain macOS 26 full-editor report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-office-macos26-full-smoke
          path: |
            artifacts/macos-arm64-native-smoke.json
            artifacts/macos-arm64-native-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  release:
    name: Publish only after all native platforms pass
    needs: [plan, native, intel_rosetta, macos26_editing]
    if: ${{ inputs.publish && inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: open-office-native-*
          path: artifacts
          merge-multiple: true
      - name: Download the independent macOS 26 editing proof
        uses: actions/download-artifact@v4
        with:
          name: open-office-macos26-editing-proof
          path: artifacts
      - name: Install independent presentation PDF inspector
        run: python -m pip install -r tests/requirements-pdf-inspection.txt
      - name: Validate all native reports and create exact source archive
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, statSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { validateFrontendReport } from './scripts/native-smoke.mjs';
          import { validateNativeOfficeWordEvidence } from './scripts/office-word-native-smoke.mjs';
          import { validateNativeOfficeSheetEvidence } from './scripts/office-sheet-native-smoke.mjs';
          import { validateNativeOfficePresentationEvidence } from './scripts/office-presentation-native-smoke.mjs';
          import { validateNativePdfEvidence } from './scripts/office-pdf-native-smoke.mjs';
          import { sha256File, verifyTransferProof } from './scripts/macos-intel-transfer.mjs';
          import { readMacosArmEditingProof, verifyMacosArmEditingProof } from './scripts/macos-arm-editing-gate.mjs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          assert.match(version, /^\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?$/);
          const editingProof = readMacosArmEditingProof('artifacts/macos26-editing-proof.json');
          verifyMacosArmEditingProof(editingProof, { commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, dmgPath: resolve(`artifacts/Open-Office-${version}-macos-arm64.dmg`), root: resolve('.') });
          const required = [];
          for (const [id, target] of [['windows-x64', 'x86_64-pc-windows-msvc'], ['macos-arm64', 'aarch64-apple-darwin'], ['macos-x64', 'x86_64-apple-darwin']]) {
            const report = JSON.parse(readFileSync(`artifacts/${id}-native-smoke.json`, 'utf8'));
            assert.equal(report.ok, true, `${id} did not pass native checks`);
            assert.equal(report.commit, process.env.GITHUB_SHA);
            assert.equal(report.runId, process.env.GITHUB_RUN_ID);
            assert.equal(report.target, target);
            assert.equal(report.platformId, id);
            assert.equal(report.process.exitCode, 0);
            assert.equal(report.process.timedOut, false);
            assert.equal(report.frontend.ok, true);
            validateFrontendReport(report.frontend);
            validateNativeOfficeWordEvidence(report);
            validateNativeOfficeSheetEvidence(report);
            validateNativeOfficePresentationEvidence(report);
            validateNativePdfEvidence(report);
            assert.equal(report.targetArch, id === 'macos-arm64' ? 'arm64' : 'x64');
            assert.equal(report.hostArch, id === 'windows-x64' ? 'x64' : 'arm64');
            assert.equal(report.executionMode, id === 'macos-x64' ? 'rosetta2' : 'native');
            if (id === 'macos-x64') {
              const proof = JSON.parse(readFileSync('artifacts/macos-x64-build-proof.json', 'utf8'));
              const transfer = JSON.parse(readFileSync('artifacts/macos-x64-transfer-validation.json', 'utf8'));
              assert.equal(proof.dmg.name, `Open-Office-${version}-macos-x64.dmg`);
              verifyTransferProof(proof, { commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, dmgPath: `artifacts/${proof.dmg.name}` });
              assert.equal(transfer.ok, true);
              assert.equal(transfer.commit, process.env.GITHUB_SHA);
              assert.equal(transfer.runId, process.env.GITHUB_RUN_ID);
              assert.equal(transfer.target, target);
              assert.equal(transfer.executionMode, 'rosetta2');
              assert.equal(transfer.targetArch, 'x64');
              assert.equal(transfer.hostArch, 'arm64');
              assert.equal(transfer.unchangedAppBytesAndSymlinks, true);
              assert.equal(transfer.originalAppResigned, false);
              assert.equal(transfer.buildProofSha256, sha256File('artifacts/macos-x64-build-proof.json'));
              assert.equal(transfer.appInventorySha256, proof.app.sha256);
              assert.equal(transfer.dmg.sha256, proof.dmg.sha256);
              assert.deepEqual(transfer.signatures, proof.signatures);
              assert.deepEqual(report.preflight.macos.cdHashes, proof.signatures);
              assert.deepEqual(report.preflight.macos.mainArchitectures, ['x86_64']);
              assert.equal(report.preflight.rosetta.hardwareArm64, 1);
              assert.equal(report.preflight.rosetta.nodeProcessTranslated, 0);
              assert.equal(report.preflight.rosetta.x86ProbeTranslated, 1);
            }
            const file = `Open-Office-${version}-${id}${id === 'windows-x64' ? '-setup.exe' : '.dmg'}`;
            assert.ok(statSync(`artifacts/${file}`).size > 0);
            required.push(file);
          }
          const source = `Open-Office-${version}-source.zip`;
          execFileSync('git', ['archive', '--format=zip', '--prefix=open-office/', `--output=artifacts/${source}`, process.env.GITHUB_SHA], { stdio: 'inherit' });
          required.push(source);
          const checksums = required.map(file => `${createHash('sha256').update(readFileSync(`artifacts/${file}`)).digest('hex')}  ${file}`).join('\n');
          writeFileSync('artifacts/SHA256SUMS', `${checksums}\n`);
          required.push('SHA256SUMS');
          writeFileSync('release-assets.json', `${JSON.stringify(required)}\n`);
          writeFileSync('release-version.txt', version);
          NODE
          (cd artifacts && sha256sum --check SHA256SUMS)
      - name: Publish installers, source, and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat release-version.txt)"
          tag="desktop-v${version}-${GITHUB_RUN_ID}"
          notes_file="docs/releases/${version}.md"
          test -s "$notes_file"
          cp "$notes_file" release-notes.md
          cat >> release-notes.md <<EOF

          演示引擎及验证记录：https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/office-presentation-integration.md
          表格引擎及已知限制：https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/office-sheet-integration.md
          第三方许可与源码：https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/THIRD_PARTY_NOTICES.md
          源码提交：${GITHUB_SHA}
          构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > existing-tag.json 2> tag-error.txt; then
            test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)" = "$GITHUB_SHA"
          elif ! grep -q 'HTTP 404' tag-error.txt; then
            cat tag-error.txt >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,tagName > existing-release.json; then
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('existing-release.json', 'utf8'));
          assert.equal(release.targetCommitish, process.env.GITHUB_SHA, 'Refusing to reuse another source commit');
          assert.equal(release.isPrerelease, true, 'Refusing to alter a stable release');
          NODE
          else
            mapfile -t assets < <(node -e 'for (const file of require("./release-assets.json")) console.log(`artifacts/${file}`)')
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Open Office ${version} · Windows / macOS" --notes-file release-notes.md "${assets[@]}"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,assets > release-ready.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('release-ready.json', 'utf8'));
          const required = JSON.parse(readFileSync('release-assets.json', 'utf8'));
          assert.equal(release.targetCommitish, process.env.GITHUB_SHA);
          assert.equal(release.isPrerelease, true);
          assert.equal(release.assets.length, required.length, 'Public release must only contain installers, source and checksums');
          for (const file of required) {
            const matches = release.assets.filter(asset => asset.name === file);
            assert.equal(matches.length, 1, `Missing or duplicate release asset: ${file}`);
            assert.ok(matches[0].size > 0, `Empty release asset: ${file}`);
          }
          NODE
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)" = "$GITHUB_SHA"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
