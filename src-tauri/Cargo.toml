[package]
name = "open-office"
version = "0.7.0"
description = "Local document, spreadsheet, presentation and PDF editing"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "open_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
tempfile = "3"
percent-encoding = "2"
word-package = { path = "../crates/word-package" }
word-engine = { path = "../crates/word-engine" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
