[package]
name = "open-office"
version = "0.10.0"
description = "Local document, spreadsheet, presentation and PDF editing"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "open_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
tempfile = "3"
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSScreen"] }
