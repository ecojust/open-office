[package]
name = "open-office"
version = "0.21.0"
description = "Local document, spreadsheet, presentation, PDF and notebook editing"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "open_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
tempfile = "3"
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSScreen", "NSPasteboard", "NSPasteboardItem", "NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSObject"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebpagePreferences"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
