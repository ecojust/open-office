[package]
name = "office-presentation-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OfficePresentation engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
office-presentation-geom = { workspace = true }
office-presentation-color = { workspace = true }
office-presentation-model = { workspace = true }
office-presentation-fonts = { workspace = true }
office-presentation-text = { workspace = true }
office-presentation-render = { workspace = true }
office-presentation-pdf = { workspace = true }
office-presentation-format = { workspace = true }
office-presentation-pptx = { workspace = true }
office-presentation-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
office-presentation-anim = { workspace = true }
zip = { workspace = true }

# The browser clock for comment timestamps (wasm has no std::time::SystemTime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

