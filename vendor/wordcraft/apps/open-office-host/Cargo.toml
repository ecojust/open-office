[package]
name = "open-office-wordcraft-host"
description = "Open Office's local WordCraft canvas host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-doc = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow", "accesskit"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Event", "EventTarget", "CustomEvent", "CustomEventInit"] }
