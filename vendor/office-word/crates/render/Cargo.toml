[package]
name = "office-word-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OfficeWord rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
office-word-geom = { workspace = true }
office-word-doc = { workspace = true }
office-word-fonts = { workspace = true }
office-word-layout = { workspace = true }
office-word-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
