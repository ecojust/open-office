[package]
name = "office-word-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OfficeWord PDF export (krilla): embedded font subsets with selectable text, links, outline, tagging"

[lints]
workspace = true

[dependencies]
office-word-doc = { workspace = true }
office-word-geom = { workspace = true }
office-word-fonts = { workspace = true }
office-word-layout = { workspace = true }
office-word-metafile = { workspace = true }
krilla = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[dev-dependencies]
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
