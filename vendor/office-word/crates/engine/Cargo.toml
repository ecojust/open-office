[package]
name = "office-word-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OfficeWord engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[dependencies]
office-word-geom = { workspace = true }
office-word-doc = { workspace = true }
office-word-fonts = { workspace = true }
office-word-layout = { workspace = true }
office-word-render = { workspace = true }
office-word-proof = { workspace = true }
office-word-docx = { workspace = true }
office-word-docbin = { workspace = true }
office-word-pdf = { workspace = true }
office-word-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
image = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock for `now_iso` (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
encoding_rs = { workspace = true }
zip = { workspace = true }
cfb = { workspace = true }
