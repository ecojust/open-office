[package]
name = "office-pdf-automation"
description = "Agent control for OfficePdf: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
office-pdf-engine = { workspace = true }
office-pdf-cos = { workspace = true }
office-pdf-render = { workspace = true }
office-pdf-organize = { workspace = true }
office-pdf-platform = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
png = "0.18"
base64 = { version = "0.22", optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
office-pdf-fonts = { workspace = true }
flate2.workspace = true
office-pdf-model = { workspace = true }
office-pdf-xfa = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
