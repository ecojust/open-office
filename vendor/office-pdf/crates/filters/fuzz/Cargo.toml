[package]
name = "office-pdf-filters-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Detached from the OfficePdf workspace: run with `cargo +nightly fuzz run decode`
# from crates/filters/.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
office-pdf-filters = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
